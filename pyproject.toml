[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "salespath_env"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "openenv",
    "fastapi",
    "uvicorn",
    "pydantic>=2.0",
    "trl>=0.8.0",
    "unsloth",
    "torch",
    "transformers",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["salespath_env*"]
