[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "salespath_env"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "openenv",
    "fastapi",
    "uvicorn",
    "pydantic>=2.0",
    "trl>=0.11.0",
    "peft>=0.11.0",
    "torch",
    "transformers>=4.44.0",
    "accelerate>=0.33.0",
    "bitsandbytes>=0.43.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["salespath_env*"]
